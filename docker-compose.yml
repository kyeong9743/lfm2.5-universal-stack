# =====================================================================
#  LFM2.5-2.6B Universal Edge Agent Server
#  하드웨어 프로파일은 전부 .env 로 제어한다. 이 파일은 수정하지 않는다.
# =====================================================================

services:
  lfm-server:
    # LFM2.5 GGUF 는 llama.cpp b10262 로 양자화되었으므로 그 이상의 빌드를 고정해서 쓴다.
    image: ghcr.io/ggml-org/llama.cpp:${IMAGE_TAG:-server-b10423}
    container_name: lfm-api
    restart: unless-stopped

    # BIND_ADDR=127.0.0.1 → 로컬 전용(기본)
    # BIND_ADDR=0.0.0.0   → 외부 개방
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"

    volumes:
      - ./models:/models:ro

    # 물리코어
    cpuset: "${CPUSET:-}"

    # 스왑 스래싱 방어. 모델 1.67GB + KV 캐시 + 런타임 여유.
    mem_limit: ${MEM_LIMIT:-3g}

    # LOAD_MODE 에 mlock 을 쓸 때 필요. auto/mmap 이면 아무 영향이 없다.
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1

    environment:
      - LLAMA_ARG_MODEL=/models/${MODEL_FILE:-LFM2.5-2.6B-Q4_K_M.gguf}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080

      # 모델 native 컨텍스트는 128K 이나, 엣지 노드의 KV 캐시 메모리를 위해 의도적으로 절삭.
      - LLAMA_ARG_CTX_SIZE=${CTX_SIZE:-4096}
      - LLAMA_ARG_THREADS=${THREADS:-4}
      - LLAMA_ARG_N_PARALLEL=${PARALLEL_REQUESTS:-1}

      - LLAMA_ARG_LOAD_MODE=${LOAD_MODE:-none}

      # LFM2.5 는 항상 <think> 를 먼저 생성하는 순수 추론 모델이다.
      # deepseek 포맷으로 파싱해 message.reasoning_content 로 분리하고
      # message.content 에는 최종 답변만 남긴다.
      - LLAMA_ARG_THINK=${REASONING_FORMAT:-deepseek}
      - LLAMA_ARG_THINK_BUDGET=${THINK_BUDGET:--1}

      # 빈 값이면 인증 없음(로컬 기본).
      - LLAMA_API_KEY=${API_KEY:-}

      # 슬롯 모니터링 엔드포인트(/slots). 외부 노출 시에는 0 권장.
      - LLAMA_ARG_ENDPOINT_SLOTS=${ENDPOINT_SLOTS:-1}

      # 기본값 '*' 는 기동 시 서버가 직접 경고를 띄운다("CORS ... no API key is set").
      # 브라우저에서 쓸 도메인만 허용하도록 좁힌다. localhost 전용은 특수값 'localhost'.
      - LLAMA_ARG_CORS_ORIGINS=${CORS_ORIGINS:-localhost}

    command: >
      --temp ${SAMPLING_TEMP:-0.1}
      --top-k ${SAMPLING_TOP_K:-50}
      --repeat-penalty ${SAMPLING_REPEAT_PENALTY:-1.1}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: ${HEALTH_START_PERIOD:-120s}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
